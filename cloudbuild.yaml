# Google Cloud Build configuration for Sanctum Backend -> GCP Cloud Run
steps:
  # 1. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/sanctum-backend:$COMMIT_SHA', '.']

  # 2. Push the container image to Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/sanctum-backend:$COMMIT_SHA']

  # 3. Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'sanctum-backend'
      - '--image=gcr.io/$PROJECT_ID/sanctum-backend:$COMMIT_SHA'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--env-vars-file=env.yaml'

images:
  - 'gcr.io/$PROJECT_ID/sanctum-backend:$COMMIT_SHA'
